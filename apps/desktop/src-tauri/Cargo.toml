[package]
name = "opencamera-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "opencamera_desktop"
crate-type = ["rlib"]

[[bin]]
name = "OpenCamera"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-notification = "2.7"
tauri-plugin-autostart = "2.7"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
opencamera-core = { path = "../../../crates/core" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
