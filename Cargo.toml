[workspace]
resolver = "2"
members = ["crates/core", "crates/vcam", "crates/vcam-win-source", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# Speeds up libraries in debug builds so live video stays smooth.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
